{{ $src := .Get "src" }}
{{ $caption := .Get "caption" }}
<figure>
  <audio controls style="width: 100%;">
    <source src="{{ .Get"src" | reURL }}" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
  {{ if $caption }}<figcaption>{{ $caption }}</figcaption>{{ end }}
</figure>
